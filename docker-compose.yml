services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris_password}
      POSTGRES_DB: ${POSTGRES_DB:-iris_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iris} -d ${POSTGRES_DB:-iris_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  iris_pgdata:
